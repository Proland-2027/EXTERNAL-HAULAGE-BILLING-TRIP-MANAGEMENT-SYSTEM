<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMG Production Planning</title>
  <meta name="description" content="Integrated production planning, manufacturing tracking and BOM costing for gensets and canopies.">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/><path d='M3 11h3V5H3zm4 0h3V3H7zm4 0h2V7h-2z' fill='white'/></svg>">
  <!-- SheetJS for .xlsx export; when the CDN is unreachable exports fall back to CSV. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
  <header class="topbar no-print" id="topbar" hidden>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▣</span>
      <div><div class="brand-title" id="brand-title">JMG Production Planning</div><div class="brand-sub" id="brand-user"></div></div>
    </div>
    <nav class="tabs" id="nav" aria-label="Sections"></nav>
    <div class="row">
      <button class="btn ghost sm" id="theme-toggle" title="Toggle dark mode">Light / Dark</button>
      <button class="btn ghost sm" id="logout-btn">Sign out</button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <dialog id="modal" class="modal"><form method="dialog" id="modal-form" class="modal-form"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/core.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/views-plan.js"></script>
  <script src="/js/views-ops.js"></script>
  <script src="/js/views-cost.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
