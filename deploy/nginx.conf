# nginx reverse proxy with HTTPS (certbot) — serve the app at https://planning.example.com
server {
    listen 80;
    server_name planning.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name planning.example.com;
    ssl_certificate     /etc/letsencrypt/live/planning.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planning.example.com/privkey.pem;
    client_max_body_size 100m;   # workbook uploads
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
