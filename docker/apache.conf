<VirtualHost *:80>
    DocumentRoot /var/www/app/server/public
    <Directory /var/www/app/server/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    # trust X-Forwarded-Proto from the HTTPS reverse proxy (Caddy / Nginx / Cloudflare)
    SetEnvIf X-Forwarded-Proto https HTTPS=on
    Header always set X-Frame-Options SAMEORIGIN
    Header always set Referrer-Policy strict-origin-when-cross-origin
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
