<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Planning</title>
  <meta name="description" content="Integrated production planning, manufacturing tracking and BOM costing for gensets and canopies.">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a78d6'/%3E%3Cpath d='M7 22h4v-8H7zm7 0h4V8h-4zm7 0h4v-5h-4z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- SheetJS for Excel export; CSV fallback when the CDN is unreachable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar no-print" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▣</span>
        <div><div class="brand-title">Production Planning</div><div class="brand-sub" id="brand-company">Gensets &amp; Canopies</div></div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot">
        <div id="user-box" class="user-box"></div>
        <div class="row small">
          <button class="btn ghost sm" id="theme-toggle" title="Toggle dark mode">Light / Dark</button>
          <button class="btn ghost sm" id="logout-btn">Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar no-print">
        <button class="btn ghost sm menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="row" id="topbar-actions"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="modal" class="modal"><form method="dialog" id="modal-form" class="modal-form"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/views-planning.js"></script>
  <script src="/js/views-production.js"></script>
  <script src="/js/views-costing.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
