# fly.io: `fly launch --copy-config --no-deploy && fly volumes create ppm_data --size 5 && fly deploy`
app = "jmg-production-planning"
primary_region = "lhr"
[build]
[env]
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  PORT = "8080"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"
[[mounts]]
  source = "ppm_data"
  destination = "/data"
